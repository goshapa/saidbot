{% extends "base.html" %}
{% block title %}Изменить товар — SaidBot Admin{% endblock %}
{% block content %}
<a href="/products" class="btn btn-link px-0">&larr; К товарам</a>
<div class="card">
  <div class="card-body">
    <h4>Изменить товар</h4>
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Название</label>
        <input type="text" name="title" class="form-control" value="{{ product.title }}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Кол-во/срок</label>
        <input type="number" name="amount" class="form-control" value="{{ product.amount or '' }}">
      </div>
      <div class="col-md-3" id="fixed-price-field">
        <label class="form-label">Цена</label>
        <input type="number" step="0.01" name="price" id="price-input" class="form-control" value="{{ product.price }}">
      </div>
      <div class="col-md-8">
        <label class="form-label">Что спрашивать у покупателя</label>
        <input type="text" name="recipient_label" class="form-control" value="{{ product.recipient_label }}">
      </div>
      <div class="col-md-4 d-flex align-items-end gap-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="requires_recipient" {% if product.requires_recipient %}checked{% endif %}>
          <label class="form-check-label">Спрашивать получателя</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}>
          <label class="form-check-label">Активен</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="is_variable" id="is-variable-check" {% if product.is_variable %}checked{% endif %}>
          <label class="form-check-label">Переменное количество (покупатель сам вводит сколько)</label>
        </div>
      </div>
      <div class="col-md-4" id="unit-price-field" style="display:none;">
        <label class="form-label">Цена за 1 шт</label>
        <input type="number" step="0.01" name="unit_price" class="form-control" value="{{ product.unit_price or '' }}">
      </div>
      <div class="col-md-4" id="min-qty-field" style="display:none;">
        <label class="form-label">Минимальное количество</label>
        <input type="number" name="min_quantity" class="form-control" value="{{ product.min_quantity or 1 }}">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>
<script>
  (function () {
    const checkbox = document.getElementById("is-variable-check");
    const priceField = document.getElementById("fixed-price-field");
    const unitField = document.getElementById("unit-price-field");
    const qtyField = document.getElementById("min-qty-field");
    function sync() {
      const variable = checkbox.checked;
      priceField.style.display = variable ? "none" : "";
      unitField.style.display = variable ? "" : "none";
      qtyField.style.display = variable ? "" : "none";
    }
    checkbox.addEventListener("change", sync);
    sync();
  })();
</script>
{% endblock %}
